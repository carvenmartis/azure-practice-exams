services:
  azure-practice-exams:
    image: carvenmartisit/azure-practice-exams:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3002:3000"
    # Daily goal reminders: the push keys and the devices that asked for one.
    # Only used when started with docker compose; without it, devices simply
    # register again the next time the app is opened after an update.
    volumes:
      - reminder-data:/app/reminder-data
      # Progress synced between devices (src/lib/server/sync.ts). Keep this
      # mapped, or every image update starts the shared copy from scratch.
      - sync-data:/app/sync-data
    environment:
      # Contact address sent to Apple and Google with each reminder.
      VAPID_SUBJECT: "https://hub.docker.com/r/carvenmartisit/azure-practice-exams"
    restart: unless-stopped
    labels:
      # Lets watchtower pull new :latest images and restart this container,
      # so open pages show the "new version available" notice.
      - com.centurylinklabs.watchtower.enable=true
    # Starting the app always starts watchtower too
    depends_on:
      - watchtower

  # Checks Docker Hub every minute for a new :latest image and restarts the
  # app with it. Docker restarts it if it ever stops. Only touches containers
  # labelled above. Maintained fork of the archived containrrr/watchtower.
  watchtower:
    image: nickfedor/watchtower:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_POLL_INTERVAL: "60"
      WATCHTOWER_CLEANUP: "true"
    restart: always

volumes:
  reminder-data:
  sync-data:
