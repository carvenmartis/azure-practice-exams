name: Build and deploy to Docker Hub

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer run on the same branch (or PR) cancels the one still in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Docker Hub account the image is published under
  DOCKERHUB_NAMESPACE: carvenmartisit
  IMAGE_NAME: azure-practice-exams

jobs:
  build:
    name: Lint and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    name: Build and push Docker image
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # <major>.<minor> from package.json + the workflow run number, e.g. 1.0.42
      - name: Version
        id: version
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")
          echo "version=${base}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: docker.io/${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha
            type=ref,event=pr

      # Pull requests only build the image; pushes to main also publish it
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Keep latest plus the newest KEEP version builds on Docker Hub and
      # delete older tags. Needs a token with Read, Write, Delete access.
      - name: Clean up old tags on Docker Hub
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          KEEP: 2
        run: |
          set -euo pipefail
          api=https://hub.docker.com/v2
          ns="$DOCKERHUB_NAMESPACE"
          repo="$IMAGE_NAME"

          jwt=$(jq -n --arg u "$DOCKERHUB_USERNAME" --arg p "$DOCKERHUB_TOKEN" '{identifier: $u, secret: $p}' \
            | curl -fsS -X POST "$api/auth/token" -H 'Content-Type: application/json' -d @- | jq -r .access_token)

          # Collect every tag (name + digest), following pagination
          url="$api/namespaces/$ns/repositories/$repo/tags?page_size=100"
          tags='[]'
          while [ -n "$url" ] && [ "$url" != "null" ]; do
            page=$(curl -fsS -H "Authorization: Bearer $jwt" "$url")
            tags=$(jq -c --argjson acc "$tags" '$acc + [.results[] | {name, digest}]' <<<"$page")
            url=$(jq -r '.next' <<<"$page")
          done

          # Images of the newest KEEP version tags (x.y.z), newest first
          keep_digests=$(jq -r '.[] | select(.name | test("^[0-9]+\\.[0-9]+\\.[0-9]+$")) | "\(.name) \(.digest)"' <<<"$tags" \
            | sort -V -r | head -n "$KEEP" | awk '{print $2}' | jq -R . | jq -sc .)
          if [ "$keep_digests" = "[]" ]; then
            echo "No version tags found, nothing to clean up"
            exit 0
          fi

          # Delete every tag except latest and tags pointing at a kept image
          jq -r --argjson keep "$keep_digests" \
            '.[] | select(.name != "latest" and ((.digest as $d | $keep | index($d)) | not)) | .name' <<<"$tags" \
            | while read -r tag; do
                echo "Deleting $ns/$repo:$tag"
                curl -fsS -X DELETE -H "Authorization: Bearer $jwt" "$api/repositories/$ns/$repo/tags/$tag/"
              done
