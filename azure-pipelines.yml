
trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

stages:
  - stage: Build
    displayName: Build Docker Image
    jobs:
      - job: Build
        displayName: Build
        steps:
          - checkout: self
          - script: npm install --legacy-peer-deps --silent
            displayName: 'Install npm dependencies'

          - task: Docker@2
            displayName: 'Build Docker image'
            inputs:
              command: build
              Dockerfile: Dockerfile
              tags: |
                $(Build.BuildId)
              buildContext: .
              repository: nextjs-app

          - publish: $(Build.SourcesDirectory)
            artifact: source

  - stage: Deploy
    displayName: Deploy Docker Image to Artifact
    dependsOn: Build
    jobs:
      - job: Deploy
        displayName: Save Docker Image to Drop
        steps:
          - task: Docker@2
            displayName: 'Login to Docker Hub'
            inputs:
              command: login
              containerRegistry: 'DockerHubServiceConnection' # Set this up in Azure DevOps

          - script: |
              docker tag nextjs-app:$(Build.BuildId) $(DOCKER_HUB_REPO):$(Build.BuildId)
            displayName: 'Tag image for Docker Hub'

          - script: |
              docker push $(DOCKER_HUB_REPO):$(Build.BuildId)
            displayName: 'Push image to Docker Hub'

          - script: |
              docker save nextjs-app:$(Build.BuildId) -o $(Build.ArtifactStagingDirectory)/nextjs-app.tar
            displayName: 'Save Docker image as tar'

          - publish: $(Build.ArtifactStagingDirectory)/nextjs-app.tar
            artifact: drop
