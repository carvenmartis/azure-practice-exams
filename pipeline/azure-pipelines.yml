trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  - template: vars/globals.yml

stages:
  - stage: Build
    displayName: Build Docker Image
    jobs:
      - job: Build
        displayName: Build
        steps:
          - checkout: self

          - script: npm install --legacy-peer-deps --silent
            displayName: 'Install npm dependencies'

          - task: Docker@2
            displayName: 'Build Docker Image'
            inputs:
              containerRegistry: '${{ variables.dockerHubServiceConnection }}'
              repository: '${{ variables.dockerHubNamespace }}/${{ variables.imageName }}'
              command: 'build'
              Dockerfile: Dockerfile
              tags: |
                ${{ variables.dockerImageTag }}

          - script: |
              docker save ${{ variables.dockerHubNamespace }}/${{ variables.imageName }}:${{ variables.dockerImageTag }} -o $(Build.ArtifactStagingDirectory)/${{ variables.imageName }}.tar
            displayName: 'Save Docker image as tar'

          - publish: $(Build.ArtifactStagingDirectory)/${{ variables.imageName }}.tar
            artifact: drop

  - stage: Deploy
    displayName: Deploy Docker Image to Artifact
    dependsOn: Build
    jobs:
      - job: Deploy
        displayName: Load and Push Docker Image
        steps:
          - download: current
            artifact: drop

          - script: |
              docker load -i $(Pipeline.Workspace)/drop/${{ variables.imageName }}.tar
            displayName: 'Load Docker image from artifact'

          - task: Docker@2
            displayName: 'Push Docker Image'
            inputs:
              containerRegistry: '${{ variables.dockerHubServiceConnection }}'
              repository: '${{ variables.dockerHubNamespace }}/${{ variables.imageName }}'
              command: 'push'
              tags: |
                ${{ variables.dockerImageTag }}
