trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  imageName: myapp
  dockerHubNamespace: yourdockerhubusername  # change this
  dockerImageTag: latest
  DOCKER_HUB_REPO: carvenmartis/azure-practice-exams

stages:
  - stage: Build
    displayName: Build Docker Image
    jobs:
      - job: Build
        displayName: Build
        steps:
          - checkout: self

          - script: npm install --legacy-peer-deps --silent
            displayName: 'Install npm dependencies'

          - task: Docker@2
            displayName: 'Build Docker Image'
            inputs:
              containerRegistry: 'dockerHubServiceConnection'
              repository: '$(dockerHubNamespace)/$(imageName)'
              command: 'build'
              Dockerfile: Dockerfile
              tags: |
                $(dockerImageTag)

  - stage: Deploy
    displayName: Deploy Docker Image to Artifact
    dependsOn: Build
    jobs:
      - job: Deploy
        displayName: Save Docker Image to Drop
        steps:
          - task: Docker@2
            displayName: 'Push Docker Image'
            inputs:
              containerRegistry: 'dockerHubServiceConnection'
              repository: '$(dockerHubNamespace)/$(imageName)'
              command: 'push'
              tags: |
                $(dockerImageTag)
